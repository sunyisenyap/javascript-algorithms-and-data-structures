<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
    }
    select, button {
      padding: 10px;
      margin: 10px 5px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #weather-info {
      margin-top: 30px;
      display: none;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    #weather-info.active {
      display: block;
    }
    #weather-icon {
      width: 100px;
      height: 100px;
    }
  </style>
</head>
<body>

  <h1>Weather App</h1>
  
  <select id="city-select">
    <option value=""></option>
    <option value="new york">New York</option>
    <option value="los angeles">Los Angeles</option>
    <option value="chicago">Chicago</option>
    <option value="paris">Paris</option>
    <option value="tokyo">Tokyo</option>
    <option value="london">London</option>
  </select>
  
  <button id="get-weather-btn">Get Weather</button>

  <div id="weather-info">
    <h2 id="location"></h2>
    <img id="weather-icon" src="" alt="Weather Icon">
    <p id="weather-main"></p>
    <p>Main Temperature: <span id="main-temperature"></span> °C</p>
    <p>Feels Like: <span id="feels-like"></span> °C</p>
    <p>Humidity: <span id="humidity"></span> %</p>
    <p>Wind Speed: <span id="wind"></span> m/s</p>
    <p>Wind Gust: <span id="wind-gust"></span> m/s</p>
  </div>

  <script>
    // Tes 14, 15, 16, 24: Fungsi async getWeather, bukan const, menerima city, return JSON, log error
    async function getWeather(city) {
      try {
        const response = await fetch(`https://weather-proxy.freecodecamp.rocks/api/city/${encodeURIComponent(city)}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
      } catch (error) {
        console.error(error);
        return undefined;
      }
    }

    // Tes 13, 16, 17, 18: Fungsi async showWeather, bukan const, memanggil getWeather, handle undefined
    async function showWeather(city) {
      const data = await getWeather(city);
      
      // Tes 18 & 25: Menangani kasus getWeather mengembalikan undefined (termasuk saat error di Paris)
      if (data === undefined) {
        alert("Something went wrong, please try again later.");
        return;
      }

      // Tes 19-23: Menampilkan data, menggunakan "N/A" jika undefined
      document.getElementById('location').textContent = data.name !== undefined ? data.name : "N/A";
      
      const weather0 = data.weather && data.weather[0];
      const icon = (weather0 && weather0.icon !== undefined) ? weather0.icon : "N/A";
      const mainWeather = (weather0 && weather0.main !== undefined) ? weather0.main : "N/A";
      
      document.getElementById('weather-icon').src = icon;
      document.getElementById('weather-main').textContent = mainWeather;
      
      const main = data.main || {};
      document.getElementById('main-temperature').textContent = main.temp !== undefined ? main.temp : "N/A";
      document.getElementById('feels-like').textContent = main.feels_like !== undefined ? main.feels_like : "N/A";
      document.getElementById('humidity').textContent = main.humidity !== undefined ? main.humidity : "N/A";
      
      const wind = data.wind || {};
      document.getElementById('wind').textContent = wind.speed !== undefined ? wind.speed : "N/A";
      document.getElementById('wind-gust').textContent = wind.gust !== undefined ? wind.gust : "N/A";

      // Tampilkan container informasi cuaca
      document.getElementById('weather-info').classList.add('active');
    }

    // Event listener untuk tombol
    document.getElementById('get-weather-btn').addEventListener('click', () => {
      const city = document.getElementById('city-select').value;
      // Jika tidak ada kota yang dipilih (value kosong), tidak melakukan apa-apa
      if (city) {
        showWeather(city);
      }
    });
  </script>
</body>
</html>
